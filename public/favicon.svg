<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <mask id="windowsMask" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="64" height="64" fill="white" />
      <!-- window holes (black = transparent in mask) -->
      <rect x="12" y="16" width="8" height="12" rx="1" ry="1" fill="black" />
      <rect x="22" y="16" width="8" height="12" rx="1" ry="1" fill="black" />
      <rect x="34" y="16" width="8" height="12" rx="1" ry="1" fill="black" />
      <rect x="46" y="16" width="8" height="12" rx="1" ry="1" fill="black" />
    </mask>
  </defs>

  <g mask="url(#windowsMask)">
    <rect width="64" height="40" y="8" rx="6" ry="6" fill="#1E3A8A" />
    <rect x="6" y="18" width="52" height="12" rx="3" ry="3" fill="#ffffff" opacity="0.06" />
    <rect x="8" y="12" width="16" height="10" rx="2" ry="2" fill="#fff" opacity="0.06" />
    <rect x="6" y="26" width="52" height="6" rx="2" ry="2" fill="#fff" opacity="0.06" />
  </g>
  <circle cx="18" cy="48" r="5" fill="#111827" />
  <circle cx="46" cy="48" r="5" fill="#111827" />
  <circle cx="18" cy="48" r="2.5" fill="#9CA3AF" />
  <circle cx="46" cy="48" r="2.5" fill="#9CA3AF" />
  <g stroke="#ffffff" stroke-width="0.9" fill="none">
    <rect x="12" y="16" width="8" height="12" rx="1" ry="1"/>
    <rect x="22" y="16" width="8" height="12" rx="1" ry="1"/>
    <rect x="34" y="16" width="8" height="12" rx="1" ry="1"/>
    <rect x="46" y="16" width="8" height="12" rx="1" ry="1"/>
  </g>
</svg>
